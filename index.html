<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tim Marrs – Prints</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css?v=12">
</head>
<body>

  <header>
    <a href="index.html" class="site-title site-title--text">Tim Marrs</a>
    <nav>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
    </nav>
  </header>

  <main>
    <div id="product-detail-panel" class="product-detail-panel" style="display:none">
      <div class="carousel-column">
        <div class="carousel-row">
          <button class="carousel-btn carousel-prev" id="carousel-prev" aria-label="Previous image">&#8249;</button>
          <div class="product-detail-image">
            <div class="carousel" id="detail-carousel">
              <div class="carousel-track" id="carousel-track"></div>
            </div>
          </div>
          <button class="carousel-btn carousel-next" id="carousel-next" aria-label="Next image">&#8250;</button>
        </div>
        <div class="carousel-dots" id="carousel-dots"></div>
      </div>
      <div class="product-detail-info">
        <h2 id="detail-name"></h2>
        <div id="detail-price" class="product-detail-price"></div>
        <hr class="detail-divider">
        <div id="detail-description" class="product-detail-description"></div>
        <button id="detail-add-to-cart" class="btn-add-to-cart">Buy Me!</button>
      </div>
    </div>

    <div class="product-grid" id="product-grid"></div>
  </main>

  <footer>
    <p class="footer-copyright">&copy; Tim Marrs</p>
    <form class="footer-signup" id="footer-signup">
      <p class="footer-signup-label">Sign up to hear about new prints and releases.</p>
      <div class="footer-signup-form">
        <input type="email" class="signup-input" placeholder="your@email.com" required>
        <button type="submit" class="signup-btn">Sign up</button>
      </div>
    </form>
  </footer>

  <div class="signup-overlay" id="signup-overlay">
    <div class="signup-popup">
      <button class="signup-popup-close" id="signup-popup-close" aria-label="Close">&times;</button>
      <p class="footer-signup-label">Sign up to hear about new prints and releases.</p>
      <form class="footer-signup" id="popup-signup">
        <div class="footer-signup-form">
          <input type="email" class="signup-input" placeholder="your@email.com" required>
          <button type="submit" class="signup-btn">Sign up</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/cart.js?v=2"></script>
  <script src="js/main.js?v=9"></script>
  <script src="js/signup.js"></script>
</body>
</html>
