backend:
  name: github
  repo: artofgarrett/artofgarrett
  branch: main
  base_url: https://scottgarrettartist.com
  auth_endpoint: api/auth

editor:
  preview: false

media_folder: "images"
public_folder: "images"

collections:
  - name: "products"
    label: "Products"
    files:
      - name: "all-products"
        label: "All Products"
        file: "products.json"
        format: json
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            summary: "{{fields.name}} — £{{fields.price}}"
            fields:
              - { label: "ID", name: "id", widget: "string", hint: "Unique identifier, no spaces e.g. my-new-painting" }
              - { label: "Name", name: "name", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - { label: "Ceramics", value: "ceramics" }
                  - { label: "Paintings", value: "paintings" }
                  - { label: "Collages", value: "collages" }
                  - { label: "Prints", value: "prints" }
                  - { label: "Drawings", value: "drawings" }
              - { label: "Price (£)", name: "price", widget: "number", value_type: "int" }
              - { label: "Available", name: "available", widget: "boolean", default: true }
              - { label: "Hidden", name: "hidden", widget: "boolean", default: false, required: false, hint: "Hide from shop without deleting — useful for gallery shows" }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Images"
                name: "images"
                widget: "list"
                field: { label: "Image", name: "image", widget: "image" }
