<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Scott Garrett</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css?v=89">
</head>
<body>

  <header>
    <a href="index.html" class="site-title"><img src="images/logo.png" alt="Garrettware"></a>
    <nav>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Contact</a>
      <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
    </nav>
    <div class="filters filters--hidden">
      <button class="filter-btn">Ceramics</button>
      <button class="filter-btn">Paintings</button>
      <button class="filter-btn">Collages</button>
      <button class="filter-btn">Prints</button>
    </div>
  </header>

  <main>
    <div class="text-page">

      <div class="text-section">
        <p>If nobody's home, just leave a note.</p>
      </div>

      <div class="text-section">
        <h2>Get in touch</h2>
        <p>Email: <a href="mailto:scott@garrettworld.co.uk">scott@garrettworld.co.uk</a></p>
        <p>Phone: <a href="tel:+447773561442">+44 7773 561442</a></p>
      </div>

      <div class="text-section">
        <h2>Instagram</h2>
        <p><a href="https://www.instagram.com/garrettworld/" target="_blank">@garrettworld</a></p>
      </div>

      <div class="text-section">
        <h2>Mailing List</h2>
        <p>Sign up to hear about new work, exhibitions and releases.</p>
        <form class="contact-signup" id="contact-signup">
          <div class="contact-signup-row">
            <input type="email" class="signup-input" placeholder="your@email.com" required>
            <button type="submit" class="signup-btn">Sign up</button>
          </div>
        </form>
      </div>

    </div>
  </main>

  <footer>
    <form class="footer-signup" id="footer-signup">
      <span class="footer-copyright">&copy; Scott Garrett</span>
      <div class="footer-signup-form">
        <input type="email" class="signup-input" placeholder="your@email.com" required>
        <button type="submit" class="signup-btn">Join mailing list</button>
      </div>
    </form>
  </footer>

  <script src="js/cart.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
